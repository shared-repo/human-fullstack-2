spring.application.name=imageboard

server.port=8080

# MariaDB 데이터소스 설정
spring.datasource.url=jdbc:mariadb://localhost:3306/imageboard?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
# spring.datasource.url=jdbc:mariadb://mariadb-server:3306/imageboard?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=human
spring.datasource.password=human
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

spring.mvc.hiddenmethod.filter.enabled=true

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=30MB
server.tomcat.max-swallow-size=50MB

server.web.error.whitelabel.enabled: false
server.web.error.path=/error

# spring security default formLogin username / password
# spring.security.user.name=admin
# spring.security.user.password=Pa$$w0rd

logging.file.name=logs/app.log
# Pattern for archived log files (daily rollover with compression)
# logging.logback.rollingpolicy.file-name-pattern=logs/app-%d{yyyy-MM-dd}.%i.log.gz
# Max size of a single file before rolling within the same day
# logging.logback.rollingpolicy.max-file-size=10MB
# Keep log history for 30 days
# logging.logback.rollingpolicy.max-history=30
# Max total disk size for all archived log files combined
# logging.logback.rollingpolicy.total-size-cap=1GB
# Clean up expired logs upon application startup
# logging.logback.rollingpolicy.clean-history-on-start=true

logging.level.com.example.imageboard=DEBUG

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600


# 업로드 파일 저장 경로 (커스텀 프로퍼티)
file.upload-dir=${user.home}/imageboard/uploads
file.thumbnail-dir=${user.home}/imageboard/thumbnails
file.allowed-extensions=jpg,jpeg,png,gif