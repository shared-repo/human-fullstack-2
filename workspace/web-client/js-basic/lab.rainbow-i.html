<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무지개색 이벤트 처리기</title>
    <style>
        td {
            width:100px;
            height: 100px;
            border: solid 2px;
        }
    </style>
</head>
<body>
    <table>
        <tr id="colors-tr">
            <td id="red" style="background-color: red;"></td>
            <td id="orange" style="background-color: orange;"></td>
            <td id="yellow" style="background-color: yellow;"></td>
            <td id="green" style="background-color: green;"></td>
            <td id="blue" style="background-color: blue;"></td>
            <td id="navy" style="background-color: navy;"></td>
            <td id="purple" style="background-color: purple;"></td>
        </tr>
        <tr>
            <td id="canvas" colspan="7" style="width:100%;height: 300px;background-color: rgb(200,50,150);"></td>
        </tr>
    </table>
    <script>
        // window.addEventListener('load', function(event) {
        document.addEventListener('DOMContentLoaded', function(event) {

            const canvas = document.querySelector('#canvas'); // 찾기

            // 1. 각 td를 따로 처리
            // const red = document.querySelector('#red'); // 찾기
            // red.addEventListener('click', function(event) { // 사용하기 : 이벤트 연결하기
            //     canvas.style.backgroundColor = red.style.backgroundColor;
            // });

            // const orange = document.querySelector('#orange'); // 찾기
            // orange.addEventListener('click', function(event) { // 사용하기 : 이벤트 연결하기                
            //     canvas.style.backgroundColor = orange.style.backgroundColor;
            // });    
            
            // const yellow = document.querySelector('#yellow'); // 찾기
            // yellow.addEventListener('click', function(event) { // 사용하기 : 이벤트 연결하기                
            //     canvas.style.backgroundColor = yellow.style.backgroundColor;
            // });    

            ///////////////////////////////////////////////////////

            // const tds = document.querySelectorAll('#colors-tr > td');
            // for (let i = 0; i < tds.length; i++) {
            //     tds[i].addEventListener('click', function(event) {
            //         // canvas.style.backgroundColor = tds[i].style.backgroundColor;
            //         const td = event.target; // event.target : 현재 이벤트가 발생한 객체
            //         canvas.style.backgroundColor = td.style.backgroundColor;
            //     });

            // }

            ///////////////////////////////////////////////////////

            const tds = document.querySelectorAll('#colors-tr > td');
            for (let i = 0; i < tds.length; i++) {
                tds[i].addEventListener('mouseover', function(event) {                   
                    const td = event.target; // event.target : 현재 이벤트가 발생한 객체
                    canvas.style.backgroundColor = td.style.backgroundColor;
                });
                tds[i].addEventListener('mouseout', function(event) {
                    canvas.style.backgroundColor = "";
                });
            }
        });
    </script>
    
</body>
</html>
