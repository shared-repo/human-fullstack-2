<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제어문 (선택문)</title>
</head>
<body>
    
    <script>
        // 0 ~ 100 정수 3개를 랜덤 추출해서 변수에 저장
        // 변수 이름은 각각 score1, score2, score3
        let score1 = Math.round( Math.random() * 100 );
        let score2 = Math.round( Math.random() * 100 );
        let score3 = Math.round( Math.random() * 100 );

        // 총점, 평균 계산해서 각각 변수에 저장 (total, average)
        let total = score1 + score2 + score3;
        let average = total / 3;

        // 평균 기준 등급을 계산해서 변수에 저장 (grade) : if ~ else 사용
        let grade;

        // if (average >= 90) {
        //     grade = 'A';
        // } else if (average >= 80) {
        //     grade = 'B';
        // } else if (average >= 70) {
        //     grade = 'C';
        // } else if (average >= 60) {
        //     grade = 'D';
        // } else {
        //     grade = 'F';
        // }
        // // 총점, 평균, 등급 출력
        // document.write(`<h1 style='text-align:center'>[총점: ${total}][평균: ${average}][등급: ${grade}]</h1>`);

        // if (average >= 60) {
        //     grade = '합격';
        // } else {
        //     grade = '불합격';
        // }
        // // 총점, 평균, 등급 출력
        // document.write(`<h1 style='text-align:center'>[총점: ${total}][평균: ${average}][등급: ${grade}]</h1>`);

        grade = average >= 60 ? '합격' : '불합격';
        // 총점, 평균, 등급 출력
        document.write(`<h1 style='text-align:center'>[총점: ${total}][평균: ${average}][등급: ${grade}]</h1>`);
        
    </script>
</body>
</html>
