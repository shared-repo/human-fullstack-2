<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>함수</title>
</head>
<body>
    <script>        
        // 함수 정의 : 함수 만들기
        function drawBox(width=30, height=15) { // width, height : 전달인자 (함수의 지역 변수) : 호출하는 곳으로부터 데이터를 받는 역할
            document.write("<table>");
            for (let y = 0; y < height; y++) {
                document.write("<tr>");
                for (let x = 0; x < width; x++) {
                    if (x == 0 || x == width-1 || y == 0 || y == height-1) { // a || b --> or a 또는 b 중 한 개만 true여도 전체 true
                        document.write("<td>*</td>");
                    } else {
                        document.write("<td>&nbsp;</td>");
                    }
                }
                document.write("</tr>");
            }
            document.write("</table>");
        }
        function callDrawBox() {
            let width = 20, height = 10;
            drawBox(width, height); // 함수 호출 : 함수 실행
            drawBox(50, 20);
            drawBox(); // 전달인자를 제공하지 않으면 기본 값 사용
            drawBox(100) // 첫 번째 전달인자는 제공, 두 번째 전달인자는 기본 값 사용
            document.write(`<h2>${width}</h2>`);    
        }
        callDrawBox();

    </script>
    
</body>
</html>
