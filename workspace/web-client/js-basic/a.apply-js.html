<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello, Javascript</title>
    
    <!-- 자바스크립트 적용 2-1. 페이지 방식 : HTML의 특정 영역에 코드 작성 -->
    <script>
        alert('hello, javascript 1');
    </script>
</head>
<body>

    <!-- 자바스크립트 적용 2-2. 페이지 방식 : HTML의 특정 영역에 코드 작성 -->
    <script>
        alert('hello, javascript 2');
    </script>

    <!-- 자바스크립트 적용 1. 인라인 방식 : HTML 요소에 직접 코드 작성 -->
    <button style="width:300px; height:100px; border: solid 3px red"
            onclick="alert('눌러 주셔서 감사합니다.')">눌러 주세요</button>

    <!-- 자바스크립트 적용 2-2. 페이지 방식 : HTML의 특정 영역에 코드 작성 -->
    <script>
        alert('hello, javascript 3');
    </script>

    <script src="myscript.js"></script>
    
</body>
</html>
