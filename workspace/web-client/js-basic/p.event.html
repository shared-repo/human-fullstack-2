<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>이벤트 처리</title>
    <style>
        button {
            width: 100px;
            height: 50px;
            border: solid 1px;
            background-color: orange;
        }
    </style>
</head>
<body>
    <script>
        function randomRange(min, max) {
            const gap = max - min;
            const selectedValue = Math.random() * gap + min;

            return selectedValue; // 함수를 종료하고 selectedValue를 호출한 곳으로 반환
        }
    </script>

    <button onclick="alert('눌러 주셔서 감사합니다.')">눌러!</button>
    <button onclick="alert(randomRange(10, 100));">난수를 뽑아!</button>
    
</body>
</html>
