<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문서 객체 연습</title>
</head>
<body>
    
    <button id="btn">오늘의 운세</button>
    <hr>
    <div id="message"></div>

    <script>

        // 1. 찾기
        const btn = document.querySelector("#btn");
        // const btn = document.getElementById('btn');
        // 2. 사용하기 (이벤트 처리기 연결)
        btn.addEventListener('click', function(event) {
            const idx = Math.floor(Math.random() * 20);
            const fortune = fortunes[idx];

            // 1. 찾기
            const message = document.querySelector('#message');
            // 2. 사용 (표시 내용 변경)
            // message.innerHTML = fortune;
            message.innerText = fortune;
        });

        const fortunes = [
            "오늘은 예상치 못한 좋은 소식이 찾아올 수 있습니다.",
            "작은 실수가 큰 불편으로 이어질 수 있으니 주의하세요.",
            "새로운 사람과의 만남이 긍정적인 기회를 가져다줄 것입니다.",
            "계획했던 일이 생각보다 지연될 수 있습니다.",
            "평소보다 집중력이 높아져 업무나 공부가 잘 풀릴 수 있습니다.",
            "금전적인 지출이 예상보다 늘어날 수 있으니 소비를 점검하세요.",
            "주변 사람의 도움으로 어려운 문제가 해결될 가능성이 있습니다.",
            "사소한 오해가 인간관계에 영향을 줄 수 있으니 말에 신중하세요.",
            "도전적인 선택이 좋은 결과로 이어질 수 있는 날입니다.",
            "피로가 누적되어 컨디션이 저하될 수 있으니 휴식을 챙기세요.",
            "오랫동안 기다리던 기회가 드디어 찾아올 수 있습니다.",
            "기대가 너무 크면 실망도 커질 수 있으니 균형을 유지하세요.",
            "창의적인 아이디어가 인정받을 가능성이 높습니다.",
            "예상치 못한 변수로 일정이 변경될 수 있습니다.",
            "행운이 따르는 날로 작은 시도에서도 성과를 얻을 수 있습니다.",
            "중요한 결정은 한 번 더 검토하는 것이 좋겠습니다.",
            "가까운 사람과의 대화에서 뜻밖의 힌트를 얻을 수 있습니다.",
            "감정적인 대응이 문제를 키울 수 있으니 침착함을 유지하세요.",
            "노력한 만큼 보상을 받을 가능성이 높은 하루입니다.",
            "무리한 욕심은 손해로 이어질 수 있으니 적당한 선을 지키세요."
        ];

    </script>
    
</body>
</html>
