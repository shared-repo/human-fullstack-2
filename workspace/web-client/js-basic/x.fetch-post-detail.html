<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch 함수 연습</title>
</head>
<body>    
    <div id="message"></div>
    <script>
        window.addEventListener('load', function(event) {
            
            const div = document.querySelector('#message');

            // alert(window.location.href);
            // alert(window.location.search);
            // const id = location.search.split('=')[1]; // '?id=10' -> ['?id', '10']

            const qs = new URLSearchParams(window.location.search); // '?a=10&b=hello' -> { 'a': 10, 'b': 'hello'}
            const id = qs.get('id'); //?...&id=10&... -> id의 값인 10 반환

            fetch(`https://jsonplaceholder.typicode.com/posts/${id}`)
                .then( function(response) { return response.json(); } )
                .then( function(json) {
                    // div.innerHTML = `<h3>${json.title}</h3><h5>${json.body}</h5>`;
                    
                    // div.innerHTML = `<h3>${json.title}</h3>`;
                    // div.innerHTML += `<h5>${json.body}</h5>`;

                    div.innerHTML = `<h3>${json.title}</h3>` +
                                    `<h5>${json.body}</h5>`;
                });
           
        });
    </script>
    
</body>
</html>
