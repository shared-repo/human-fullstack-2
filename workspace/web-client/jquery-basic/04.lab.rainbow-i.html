<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무지개색 이벤트 처리기 with jQuery</title>
    <style>
        td {
            width:100px;
            height: 100px;
            border: solid 2px;
        }
    </style>
</head>
<body>
    <table>
        <tr id="colors-tr">            
        </tr>
        <tr>
            <td id="canvas" colspan="8" style="width:100%;height: 300px;background-color: rgb(200,50,150);"></td>
        </tr>
        <tr>
            <td id="message" colspan="8"></td>
        </tr>
    </table>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(function() {

            const canvas = $('#canvas'); // 찾기

            const colors = ['red', 'orange', 'yellow', 'green', 'blue', 'navy', 'purple', 'random'];

            const colorsTr = $('#colors-tr');
            colors.forEach(function(color, idx) {
                const td = $('<td></td>').css('background-color', color)
                                         .attr('id', color);

                // td.on('mouseover', function(event) {                   
                //     // 이벤트 처리기 안에서 event.target은 jQuery 객체가 아님
                //     canvas.css('background-color', $(event.target).css('background-color'));
                // }).on('mouseout', function(event) {
                //     canvas.css('background-color', '');
                // });
                td.on({
                    'mouseover': function(event) {                   
                        // 이벤트 처리기 안에서 event.target은 jQuery 객체가 아님
                        canvas.css('background-color', $(event.target).css('background-color'));
                    },
                    'mouseout': function(event) {
                        canvas.css('background-color', '');
                    },
                    'click': function(event) {
                        $('#message').text(`[${event.clientX}][${event.clientY}]/[${event.pageX}][${event.pageY}]/[${event.screenX}][${event.screenY}]`);
                    }
                });

                // td.appendTo(colorsTr);
                colorsTr.append(td);
            });
        });
    </script>
    
</body>
</html>
