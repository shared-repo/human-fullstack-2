<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선택자 연습</title>
</head>
<body>

    <div id="container">
        <h2>공지사항</h2>
        <ul id="notice-list">
            <li class="important">필독 공지 1</li>
            <li>일반 공지 2</li>
            <li class="important">필독 공지 3</li>
            <li>일반 공지 4</li>
            <li class="new">새 공지 5</li>
        </ul>
        <button id="btn-hide">짝수 항목 숨기기</button>
        <button id="btn-highlight">필독 강조</button>
    </div>
    
    <script src="http://code.jquery.com/jquery-4.0.0.js"></script>

    <script>
        jQuery(function() { // jQuery == $
            // const elements_v = document.querySelectorAll('.important');

            // const elements = $('.important'); // class='important' 인 모든 요소 찾기
            // elements.css('color', 'red'); // element.style.color = 'red'
            $('.important').css('color', 'red');

            // $('li:nth-child(2n)').css('background-color', 'orange'); // nth-child : 1부터 시작하는 순서 번호 사용
            $('li:even').css('background-color', 'orange'); // 'li:even' : 여러 개의 li 중에서 0부터 시작하는 순서 번호가 짝수인 요소

            $('#btn-hide').on('click', function(event) { // on == addEventListener
                $('li:even').hide();
            });
            $('#btn-highlight').on('click', function(event) { // on == addEventListener
                $('li:even').css('font-weight', 'bold');;
            });

            alert( $('li').last().prev().text() ); // last() : 마지막 요소 찾기, prev() : 같은 레벨의 이전 요소 찾기
        });
    </script>
</body>
</html>
